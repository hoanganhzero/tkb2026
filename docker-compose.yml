services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tkb
      POSTGRES_PASSWORD: tkb_dev_only
      POSTGRES_DB: tkb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
